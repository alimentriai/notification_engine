        "400":
          description: "Invalid request (validation, unknown template, missing variable,\
            \ invalid recipient). Do not retry unchanged."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, unknown or revoked X-Api-Key. Do not retry; fix the\
            \ key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The key is valid but lacks the required scope, or a project\
            \ key was used on /admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found, or it belongs to another project (the two are deliberately\
            \ indistinguishable)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Conflict (for example NOT_RETRYABLE, DUPLICATE_REQUEST). See\
            \ the error code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit, daily quota or OTP limit reached. Honour the Retry-After\
            \ header, then retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
      - Preferences
      summary: Replace/update a user's preferences (scope PREFERENCES)
      description: "OTP, VERIFICATION and SYSTEM are mandatory and cannot be disabled\
        \ (400 MANDATORY_CATEGORY). MARKETING is opt-in: it is cancelled unless enabled\
        \ here."
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
        required: true
      responses:
        "200":
