openapi: 3.1.0
info:
  title: Notification Engine v2
  description: |-
    Generic multi-project notification service. A project sends one request; the engine validates it, applies the user's preferences, renders a versioned template, stores it, and delivers it through email (Amazon SES), SMS (Amazon SNS), in-app inbox or push.

    **Authentication.** Every route except health and API docs needs an `X-Api-Key` header. A project key identifies the project; all data is isolated per project. `/admin/**` needs the platform admin key.

    **Delivery is asynchronous.** `POST /notifications` returns 202. Poll `GET /notifications/{id}` for the status. `SENT` means the provider accepted the message, not that the recipient received it.

    **Idempotency.** Send a stable `idempotencyKey` per business event; a replay returns the original notification and never sends twice.
  contact:
    name: Notification engine owner
    email: replace-me@example.com
  license:
    name: Proprietary - internal use
    identifier: LicenseRef-Proprietary
  version: 1.0.0
servers:
- url: "{baseUrl}/api/v1"
  description: Notification engine
  variables:
    baseUrl:
      description: "Scheme, host and port of the engine"
      default: http://localhost:8082
security:
- apiKey: []
tags:
- name: Notifications
  description: "Create, track and retry notifications (scopes SEND, READ, RETRY)"
- name: OTP
  description: "One-time codes with expiry, attempt limits and resend cooldown (scope\
    \ OTP)"
- name: Templates
  description: Per-project versioned templates (scope TEMPLATES)
- name: Preferences
  description: User consent per channel and category (scope PREFERENCES)
- name: Inbox
  description: In-app notifications and push device tokens (scope INBOX)
- name: Admin
  description: "Platform administration: projects, API keys, dead-letter queue (admin\
    \ key)"
paths:
  /notification-preferences:
    get:
      tags:
      - Preferences
      summary: Get a user's preferences (scope PREFERENCES)
      operationId: get
      parameters:
      - name: userRef
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
