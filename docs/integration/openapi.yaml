      summary: Create and dispatch a notification (scope SEND)
      description: "Validates the request, applies preferences, pins the template\
        \ version, stores one notification per channel and queues delivery. Returns\
        \ 202; delivery is asynchronous. In-app notifications are DELIVERED immediately.\
        \ Replaying the same idempotencyKey returns the original notifications and\
        \ never sends twice. Category OTP is rejected here (use /otp/send). Omit channels\
        \ to use the configured defaults for the category."
      operationId: create_1
      requestBody:
        content:
