        cap return 429 with Retry-After. A delivery failure returns 502 OTP_DELIVERY_FAILED
        and leaves no usable challenge.
      operationId: send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
