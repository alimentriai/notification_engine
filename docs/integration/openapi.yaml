          - EMAIL
          - SMS
          - PUSH
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - OTP
          - VERIFICATION
          - APPROVAL
          - SUCCESS
          - ERROR
          - WARNING
          - INFO
          - REMINDER
          - SYSTEM
          - MARKETING
      - name: recipientRef
        in: query
        required: false
        schema:
          type: string
      - name: from
