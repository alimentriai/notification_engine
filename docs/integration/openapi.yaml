  /notifications/{id}/retry:
    post:
      tags:
      - Notifications
      summary: Retry a failed notification (scope RETRY)
      description: Only FAILED notifications whose failure is retryable (retries exhausted).
        Permanent failures return 409 NOT_RETRYABLE.
      operationId: retry
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Re-queued
          content:
            '*/*':
