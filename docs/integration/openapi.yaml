components:
  schemas:
    Error:
      description: "Stable error body. 'code' is machine readable and safe to branch\
        \ on; 'message' is for humans; 'correlationId' identifies the request in the\
        \ engine logs. Provider payloads, stack traces and secrets are never returned."
      properties:
        code:
          type: string
          example: TEMPLATE_NOT_FOUND
        message:
          type: string
          example: No active template 'welcome' for channel EMAIL
        correlationId:
          type: string
          example: 7f5d415f-c0d4-4a4c-b2f1-94eea7768fde
    PreferenceItem:
      type: object
      properties:
        channel:
          type: string
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
        category:
          type: string
          enum:
          - OTP
          - VERIFICATION
          - APPROVAL
          - SUCCESS
          - ERROR
          - WARNING
          - INFO
          - REMINDER
          - SYSTEM
          - MARKETING
        enabled:
          type: boolean
      required:
      - category
      - channel
    UpdateRequest:
      type: object
      properties:
        userRef:
          type: string
          maxLength: 128
          minLength: 0
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceItem"
          minItems: 1
    PreferenceView:
      type: object
      properties:
        channel:
          type: string
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
        category:
          type: string
          enum:
          - OTP
          - VERIFICATION
          - APPROVAL
          - SUCCESS
          - ERROR
          - WARNING
          - INFO
          - REMINDER
          - SYSTEM
          - MARKETING
        enabled:
          type: boolean
        consentAt:
          type: string
          format: date-time
    CreateTemplateRequest:
      type: object
      properties:
        code:
          type: string
          example: approval-requested
          maxLength: 100
          minLength: 0
          pattern: "[A-Za-z0-9_.-]+"
        channel:
          type: string
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
          example: EMAIL
        locale:
          type: string
          description: Defaults to en
          example: en
          maxLength: 16
          minLength: 0
        subject:
          type: string
          description: Email subject / in-app title
          example: "Approval needed for weighment #{{id}}"
          maxLength: 300
          minLength: 0
        bodyHtml:
          type: string
          example: "<p>Hi {{name}}, weighment <b>#{{id}}</b> needs approval.</p>"
          maxLength: 20000
          minLength: 0
        bodyText:
          type: string
          example: "Hi {{name}}, weighment #{{id}} needs approval."
          maxLength: 5000
          minLength: 0
        dltTemplateId:
          type: string
          description: India DLT content template id (SMS)
          maxLength: 64
          minLength: 0
      required:
      - channel
    TemplateView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        channel:
          type: string
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
        locale:
          type: string
        version:
          type: integer
          format: int32
        subject:
          type: string
        bodyHtml:
          type: string
        bodyText:
          type: string
        dltTemplateId:
          type: string
        active:
          type: boolean
    VerifyRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: challengeId returned by /otp/send
        code:
          type: string
          example: "123456"
          maxLength: 12
          minLength: 0
      required:
      - challengeId
    SendRequest:
      type: object
      properties:
        channel:
          type: string
          description: EMAIL or SMS
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
          example: EMAIL
        recipient:
          type: string
          description: Email address or E.164 phone number
          example: ops@example.com
          maxLength: 320
          minLength: 0
        purpose:
          type: string
          description: What the code is for
          example: login
          maxLength: 64
          minLength: 0
          pattern: "[A-Za-z0-9_.-]+"
        locale:
          type: string
          example: en
          maxLength: 16
          minLength: 0
      required:
      - channel
    SendResult:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          format: int32
        resendAfterSeconds:
          type: integer
          format: int32
    CreateNotificationRequest:
      type: object
      description: Request to create a notification. One notification is created per
        channel.
      properties:
        type:
          type: string
          description: Free-form event name for reporting and filtering
          example: WEIGHMENT_APPROVAL_REQUESTED
          maxLength: 64
          minLength: 0
          pattern: "[A-Za-z0-9_.:-]+"
        category:
          type: string
          description: Category. MARKETING needs explicit user consent; OTP is rejected
            here (use /otp/send); OTP/VERIFICATION/SYSTEM ignore opt-outs
          enum:
          - OTP
          - VERIFICATION
          - APPROVAL
          - SUCCESS
          - ERROR
          - WARNING
          - INFO
          - REMINDER
          - SYSTEM
          - MARKETING
          example: APPROVAL
        channels:
          type: array
          description: Channels to use. Omit to use the engine's configured defaults
            for the category
          example:
          - IN_APP
          - EMAIL
          items:
            type: string
            enum:
            - IN_APP
            - EMAIL
            - SMS
            - PUSH
        templateCode:
          type: string
          description: Code of a template the project created for every requested
            channel
          example: approval-requested
          maxLength: 100
          minLength: 0
        locale:
          type: string
          description: "Template locale, falls back to en"
          example: en
          maxLength: 16
          minLength: 0
        recipient:
          $ref: "#/components/schemas/Recipient"
          description: Who receives it. ref is required for IN_APP and PUSH; email
            for EMAIL; phone (E.164) for SMS
        variables:
          type: object
          additionalProperties: true
          description: "Values for the template's {{placeholders}} (strings or numbers).\
            \ Do not put secrets here; they are stored until the contact-data retention\
            \ wipe"
          example:
            name: Ops
            id: 101
        priority:
          type: string
          description: "Priority, defaults to NORMAL"
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          example: HIGH
        idempotencyKey:
          type: string
          description: Stable key per business event (for example <entity>-<id>-<event>).
            A replay returns the original notifications and never sends twice
          example: weighment-101-approval-requested
          maxLength: 100
          minLength: 0
        scheduledAt:
          type: string
          format: date-time
          description: Do not send before this time (ISO-8601)
          example: 2026-12-01T09:00:00Z
        expiresAt:
          type: string
          format: date-time
          description: Drop the notification if still unsent after this time (ISO-8601)
          example: 2026-12-31T00:00:00Z
      required:
      - category
      - recipient
    Recipient:
      type: object
      description: Recipient identifiers. Contact data is wiped from the engine after
        the retention period and is never returned by the API
      properties:
        ref:
          type: string
          description: The calling project's own user id
          example: user-42
          maxLength: 128
          minLength: 0
        email:
          type: string
          description: Required for EMAIL
          example: ops@example.com
          maxLength: 320
          minLength: 0
        phone:
          type: string
          description: "Required for SMS, E.164 (Indian mobiles: +91 and 10 digits\
            \ starting 6-9)"
          example: "+919876543210"
          maxLength: 32
          minLength: 0
    CreateResult:
      type: object
      properties:
        requestId:
          type: string
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationView"
    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
        recipientRef:
          type: string
        type:
          type: string
        category:
          type: string
          enum:
          - OTP
          - VERIFICATION
          - APPROVAL
          - SUCCESS
          - ERROR
          - WARNING
          - INFO
          - REMINDER
          - SYSTEM
          - MARKETING
        channel:
          type: string
          enum:
          - IN_APP
          - EMAIL
          - SMS
          - PUSH
        templateCode:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - SENT
          - DELIVERED
          - FAILED
          - CANCELLED
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        attempts:
          type: integer
          format: int32
        lastErrorCode:
          type: string
        retryable:
          type: boolean
        correlationId:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
    DeviceRequest:
      type: object
      properties:
        userRef:
          type: string
          maxLength: 128
          minLength: 0
        platform:
          type: string
          maxLength: 16
          minLength: 0
        token:
          type: string
          maxLength: 512
          minLength: 0
    CreateProjectRequest:
      type: object
      properties:
        code:
          type: string
          description: Unique lowercase project code
          example: sharique-erp
          maxLength: 64
          minLength: 0
          pattern: "[a-z0-9][a-z0-9-]*"
        name:
          type: string
          example: Sharique ERP
          maxLength: 200
          minLength: 0
        defaultSenderEmail:
          type: string
          description: Verified SES sender for this project
          example: no-reply@example.com
          maxLength: 320
          minLength: 0
        sesConfigSet:
          type: string
          description: Optional SES configuration set
          maxLength: 128
          minLength: 0
        smsSenderId:
          type: string
          description: India DLT sender id (header)
          example: A1CRSH
          maxLength: 16
          minLength: 0
        smsEntityId:
          type: string
          description: India DLT principal entity id
          maxLength: 64
          minLength: 0
        rateLimitPerMin:
          type: integer
          format: int32
          description: "Requests per minute, default from engine config"
          example: 120
          minimum: 1
        dailyQuota:
          type: integer
          format: int32
          description: "Notifications per rolling 24h, default from engine config"
          example: 50000
          minimum: 1
    ProjectView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        status:
          type: string
        defaultSenderEmail:
          type: string
        rateLimitPerMin:
          type: integer
          format: int32
        dailyQuota:
          type: integer
          format: int32
    IssueKeyRequest:
      type: object
      properties:
        label:
          type: string
          description: Where the key is used
          example: erp-backend-prod
          maxLength: 100
          minLength: 0
        scopes:
          type: array
          description: "SEND, READ, RETRY, TEMPLATES, PREFERENCES, OTP, INBOX. Defaults\
            \ to SEND and READ"
          example:
          - SEND
          - READ
          items:
            type: string
          uniqueItems: true
    IssuedKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        prefix:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
          uniqueItems: true
    PageResponseNotificationView:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationView"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    KeyView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
          uniqueItems: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
  securitySchemes:
    apiKey:
      type: apiKey
      description: "Project API key (ntf_...) issued by the platform admin, or the\
        \ admin key for /admin routes."
      name: X-Api-Key
      in: header
