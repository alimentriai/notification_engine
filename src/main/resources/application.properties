spring.application.name=notification-engine-v2
server.port=8082
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:h2:mem:notify;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notify_engine
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=notify_engine
spring.flyway.default-schema=notify_engine
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---- Notification engine (all values externalised; see README) ----
notify.region=${AWS_REGION:ap-south-1}
notify.aws-endpoint=${AWS_ENDPOINT:}
notify.bootstrap-admin-key=${NOTIFY_BOOTSTRAP_ADMIN_KEY:}

# log = never contacts AWS; aws = SES + SNS
notify.providers.mode=${NOTIFY_PROVIDER_MODE:log}
notify.providers.push.enabled=${NOTIFY_PUSH_ENABLED:false}

notify.channels.in-app-enabled=true
notify.channels.email-enabled=${NOTIFY_EMAIL_ENABLED:true}
notify.channels.sms-enabled=${NOTIFY_SMS_ENABLED:true}
notify.channels.push-enabled=${NOTIFY_PUSH_CHANNEL_ENABLED:false}

notify.email.default-sender=${SES_DEFAULT_SENDER:no-reply@example.com}
notify.email.configuration-set=${SES_CONFIGURATION_SET:}
notify.sms.default-type=Transactional
notify.sms.default-sender-id=${SMS_DEFAULT_SENDER_ID:}

notify.queue.enabled=${NOTIFY_QUEUE_ENABLED:false}
notify.queue.url=${NOTIFY_QUEUE_URL:}
notify.queue.dlq-url=${NOTIFY_DLQ_URL:}
notify.queue.wait-seconds=${NOTIFY_QUEUE_WAIT_SECONDS:10}
notify.queue.visibility-timeout-seconds=${NOTIFY_QUEUE_VISIBILITY_SECONDS:60}

notify.retry.max-attempts=${NOTIFY_RETRY_MAX_ATTEMPTS:5}
notify.retry.base-delay-seconds=10
notify.retry.max-delay-seconds=900
notify.retry.jitter=0.2

notify.rate-limit.default-per-minute=120
notify.rate-limit.default-daily-quota=50000

notify.retention.days=${NOTIFY_RETENTION_DAYS:90}
notify.retention.contact-days=${NOTIFY_CONTACT_RETENTION_DAYS:7}

notify.otp.length=6
notify.otp.ttl-seconds=300
notify.otp.max-attempts=5
notify.otp.resend-cooldown-seconds=60
notify.otp.max-sends-per-hour=5
notify.otp.pepper=${NOTIFY_OTP_PEPPER:change-me-in-production}

# Default channels per category when a request omits "channels"
notify.default-channels.APPROVAL=IN_APP,EMAIL
notify.default-channels.SUCCESS=IN_APP
notify.default-channels.ERROR=IN_APP,EMAIL
notify.default-channels.WARNING=IN_APP
notify.default-channels.INFO=IN_APP
notify.default-channels.REMINDER=IN_APP,EMAIL
notify.default-channels.SYSTEM=IN_APP,EMAIL
notify.default-channels.VERIFICATION=EMAIL
